name: AMD V10 Lab28 RX 9070 XT
on:
  push:
    branches: [amd-v10-lab28]
    paths:
      - '.github/workflows/belobug-texture-experimental.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PastiiJay/klbf-lab
          ref: 122b283bd8f56e49a58b9197967e4c4d389b60f5
          path: runtime
          persist-credentials: false
      - name: Verify exact upstream and require discrete Radeon
        working-directory: runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne '122b283bd8f56e49a58b9197967e4c4d389b60f5') { throw 'Unexpected upstream revision' }
          $file = 'crates/victory-gpu/src/host.rs'
          $source = (Get-Content -LiteralPath $file -Raw).Replace("`r`n","`n")
          $start = $source.IndexOf('        // Diagnostics: the software adapter,')
          $end = $source.IndexOf('        let device = device.ok_or_else', $start)
          if ($start -lt 0 -or $end -le $start) { throw 'V10 adapter context mismatch' }
          $source = $source.Substring(0,$start) + @'
                  let factory: IDXGIFactory6 = CreateDXGIFactory2(DXGI_CREATE_FACTORY_FLAGS(0))?;
                  let mut selected: Option<IDXGIAdapter1> = None;
                  for index in 0..32u32 {
                      let adapter: IDXGIAdapter1 = match factory.EnumAdapterByGpuPreference(index, DXGI_GPU_PREFERENCE_HIGH_PERFORMANCE) {
                          Ok(adapter) => adapter,
                          Err(_) => break,
                      };
                      let desc = adapter.GetDesc1()?;
                      let end = desc.Description.iter().position(|&c| c == 0).unwrap_or(desc.Description.len());
                      let name = String::from_utf16_lossy(&desc.Description[..end]);
                      let software = desc.Flags & DXGI_ADAPTER_FLAG_SOFTWARE.0 as u32 != 0;
                      let matched = !software && desc.VendorId == 0x1002 && name.to_ascii_lowercase().contains("9070 xt") && (desc.DedicatedVideoMemory >> 20) >= 12288;
                      tracing::info!(%name, software, matched, vram_mb = desc.DedicatedVideoMemory >> 20, "V10 adapter candidate");
                      if matched {
                          tracing::info!(%name, "V10 strict RX 9070 XT adapter");
                          selected = Some(adapter);
                          break;
                      }
                  }
                  let adapter = selected.ok_or_else(|| windows::core::Error::from_hresult(windows::Win32::Foundation::E_FAIL))?;
                  D3D12CreateDevice(&adapter, D3D_FEATURE_LEVEL_12_0, &mut device)?;
          '@ + "`n" + $source.Substring($end)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $file), $source, [System.Text.UTF8Encoding]::new($false))
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile release and verify CLI
        working-directory: runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release -p victory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/release/victory.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package with upstream documented AMD settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item runtime/target/release/victory.exe,runtime/README.md,runtime/LICENSE,runtime/docs/klbf/skip-amd.txt dist/
          git -C runtime diff | Set-Content dist/strict-adapter.diff -Encoding utf8
          @{
            upstream='PastiiJay/klbf-lab'
            revision='122b283bd8f56e49a58b9197967e4c4d389b60f5'
            control_commit=$env:GITHUB_SHA
            run_id=$env:GITHUB_RUN_ID
            binary_sha256=(Get-FileHash dist/victory.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            validation='Compile and CLI only. Upstream reports experimental RX 9070 XT tests. No local hardware validation.'
          } | ConvertTo-Json | Set-Content dist/source-info.json -Encoding utf8
          @'
          param(
            [Parameter(Mandatory=$true)][string]$GameExe,
            [ValidateSet('QUALITY','SIMPLE','PERFORMANCE')][string]$Profile = 'QUALITY',
            [string]$FfxDir,
            [switch]$Prebuild
          )
          $ErrorActionPreference = 'Stop'
          $game = (Resolve-Path -LiteralPath $GameExe).Path
          Remove-Item Env:VICTORY_D3D12_WARP,Env:VICTORY_FFX_DIR,Env:VICTORY_FFX_SIMPLE,Env:VICTORY_TEXTURE_BUDGET_MB,Env:VICTORY_PRESENT_TARGET,Env:VICTORY_ASYNC_SUBMIT,Env:VICTORY_KEYS -ErrorAction SilentlyContinue
          $env:VICTORY_SHADER_OPT = '0'
          $env:VICTORY_SKIP_PIPELINES = (Get-Content "$PSScriptRoot\skip-amd.txt" -Raw).Trim()
          $env:VICTORY_LATE_WAIT = '1'
          $env:VICTORY_WIDE_BACK = '1'
          $env:VICTORY_PIPELINE_WAIT_MS = '24'
          $env:VICTORY_RELAY_COPY_QUEUE = '0'
          $env:RUST_BACKTRACE = 'full'
          $env:RUST_LOG = 'info'
          $console = 'series-x'
          if ($Profile -eq 'SIMPLE') {
            $console = 'series-s'
            $env:VICTORY_FFX_SIMPLE = '1'
          } elseif ($Profile -eq 'PERFORMANCE') {
            if (-not $FfxDir) { throw 'Provide official FidelityFX SDK signedbin directory with -FfxDir' }
            $env:VICTORY_FFX_DIR = (Resolve-Path -LiteralPath $FfxDir).Path
            $console = 'series-s'
          }
          $ErrorActionPreference = 'Continue'
          if ($Prebuild) {
            & "$PSScriptRoot\victory.exe" translate --cache --pipelines --jobs 8 (Join-Path (Split-Path $game) 'shaders.rpf') 2>&1 | Tee-Object -FilePath "$PSScriptRoot\victory-v10-prebuild.log"
            if ($LASTEXITCODE -ne 0) { throw "Pipeline prebuild exited $LASTEXITCODE; inspect log before retrying" }
          }
          & "$PSScriptRoot\victory.exe" run $game --execute --console $console 2>&1 | Tee-Object -FilePath "$PSScriptRoot\victory-v10-$Profile.log"
          exit $LASTEXITCODE
          '@ | Set-Content dist/Iniciar-V10.ps1 -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: amd-v10-lab28-9070XT
          path: dist/
          if-no-files-found: error
