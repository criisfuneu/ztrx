name: AMD Performance V12 Overlap
on:
  push:
    branches: [amd-performance-v12-overlap]
    paths:
      - '.github/workflows/belobug-texture-experimental.yml'
      - 'belobug-texture-patches/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact upstream source
        uses: actions/checkout@v4
        with:
          repository: Belobug/VIctory-Belobug-AMD
          ref: 71652a2c15a0da68cd801890e1f71109670f9ca5
          path: runtime
          persist-credentials: false
      - name: Verify upstream and compile LEAN
        shell: pwsh
        working-directory: runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($actual -ne '71652a2c15a0da68cd801890e1f71109670f9ca5') { throw 'Unexpected upstream revision' }
          git apply --check ../belobug-texture-patches/staging-history.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/staging-history.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ../belobug-texture-patches/gpu-safe.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/gpu-safe.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ../belobug-texture-patches/bindless-card-telemetry.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/bindless-card-telemetry.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ../belobug-texture-patches/performance-core.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/performance-core.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ../belobug-texture-patches/performance-core-v2.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/performance-core-v2.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ../belobug-texture-patches/performance-core-v3.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/performance-core-v3.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ../belobug-texture-patches/performance-core-v4.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/performance-core-v4.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ../belobug-texture-patches/performance-core-v7-lean.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/performance-core-v7-lean.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ../belobug-texture-patches/performance-core-v8-scaling.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/performance-core-v8-scaling.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ../belobug-texture-patches/performance-core-v9-final.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/performance-core-v9-final.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ../belobug-texture-patches/performance-core-v11-controlled.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/performance-core-v11-controlled.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --check ../belobug-texture-patches/performance-core-v12-overlap.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply ../belobug-texture-patches/performance-core-v12-overlap.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARGO_PROFILE_RELEASE_LTO = 'thin'
          $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS = '1'
          cargo build --locked --release -p victory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/release/victory.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: V11 and V12 targeted CPU unit tests
        shell: pwsh
        working-directory: runtime
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked -p victory-gpu --features diagnostics --profile diag v11_ -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p victory-gpu --features diagnostics --profile diag v12_ -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package experimental executable (GPU validation pending)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item runtime/target/release/victory.exe,runtime/README.md,runtime/LICENSE dist/
          Copy-Item belobug-texture-patches/staging-history.patch,belobug-texture-patches/gpu-safe.patch,belobug-texture-patches/bindless-card-telemetry.patch,belobug-texture-patches/performance-core.patch,belobug-texture-patches/performance-core-v2.patch,belobug-texture-patches/performance-core-v3.patch,belobug-texture-patches/performance-core-v4.patch,belobug-texture-patches/performance-core-v7-lean.patch,belobug-texture-patches/performance-core-v8-scaling.patch,belobug-texture-patches/performance-core-v9-final.patch,belobug-texture-patches/performance-core-v11-controlled.patch,belobug-texture-patches/performance-core-v12-overlap.patch dist/
          $manifest = [ordered]@{
            upstream_repository = 'Belobug/VIctory-Belobug-AMD'
            upstream_commit = '71652a2c15a0da68cd801890e1f71109670f9ca5'
            local_runtime_patches = @('staging-history.patch','gpu-safe.patch','bindless-card-telemetry.patch','performance-core.patch','performance-core-v2.patch','performance-core-v3.patch','performance-core-v4.patch','performance-core-v7-lean.patch','performance-core-v8-scaling.patch','performance-core-v9-final.patch','performance-core-v11-controlled.patch','performance-core-v12-overlap.patch')
            codegen = 'Release, Thin LTO, one codegen unit; no diagnostics feature'
            v11 = 'Independent opt-in contiguous fill merging, indexed fresh descriptor tables, bounded CPU copy thread count, integer target blending compatibility. Original fences and queue order retained. Full Join Parts, Relay, raw CBV and SGPR fixes not included.'
            v12 = 'Independent conservative experiments: join adjacent pending submissions only without deferred steps; overlap private disjoint ordinary shadow merges with card readback; use aligned CBVs within existing direct windows. Not full upstream ports. Hardware gains unvalidated.'
            validation = 'Build and CLI smoke test only at packaging; hardware validation pending. Targeted tests reported separately in this run.'
            control_commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            binary_sha256 = (Get-FileHash dist/victory.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content dist/source-info.json -Encoding utf8
          @'
          EXPERIMENTAL - AMD hardware validation pending.
          Shader translator unchanged. Optional texture history (VICTORY_TEXTURE_HISTORY=1).
          Reuse of baseline shader cache via VICTORY_SHADER_BUILD_OF is supported.
          Snapshot pools default to the original 512 MiB each.
          Card VRAM budget threshold restored to 75%; absolute cap unchanged.
          Thin LTO and one codegen unit reduce host-side code overhead (unmeasured).
          Detailed wait attribution is opt-in via VICTORY_GPU_WAIT_DETAILS=1.
          Card buffers and tile snapshot pools are reported in memory diagnostics.
          Bindless range merging compacts in place; card admissions report rejection reasons.
          Sparse heap residency and shader translation remain unchanged.
          Preserves GPU queue submission boundaries and synchronous ordering.
          V2: short-circuit list readiness checks; optional local queue dispatch when no queue is held.
          Global pumping remains for held queues and periodic cleanup. Original force timeout unchanged.
          Timeline reports completed fence/memory holds, summed microseconds and forced waits per logging interval.
          V3: optional fully covered sparse snapshot reuse and full-page unchanged readback caching, only with tile sweeping disabled.
          Optional sparse refresh parallelism uses distinct roots, non-overlapping 64 KiB ranges, and bounded batches.
          Cache and parallelism are separately configurable; submission mutex and synchronization boundaries unchanged.
          V4: opt-in parallel comparison of large sparse readbacks, followed by original serial merge and write-back.
          Bounded suppression of repeated held-memory-wait probes (100us); progress invalidates the probe, polling and forced progress retained.
          Stage timing splits card, shadow and explicit readback. No hardware overlay.
          V7 LEAN: indexed sparse pending ranges and canonical sparse root grouping; opt-in and no async. No V5 or V6 patch applied.
          V8: experimental PC FidelityFX bridge adapted from PastiiJay/klbf-lab 7b698b9652e88ecabd823f0dd9138dd9c40dd7bd (upstream PC FSR contributors). Requires separately obtained official AMD FidelityFX SDK 2.x signed DX12 binaries. No SDK DLLs are packaged. Native Series S selects the title's own render profile; actual internal and upscale sizes are logged by FSR. V8.1 includes FP16 scratch and GPU RGB9E5 packing. V9 adds exact AVX2 memory merge (scalar fallback) and skips fully covered refreshes. Performance unmeasured.
          Coalesced ordinary nonoverlapping refreshes can run in parallel (opt-in).
          Completed fences skip the event wait; main queue calls, lock and fence time are reported.
          Optional batch GPU timestamps: VICTORY_GPU_TIMING_BATCH=1 plus VICTORY_D3D12_DRED=1.
          Timestamp mode reports command durations, not hardware utilization; it adds instrumentation.
          Async submission is disabled in the preset following a device-hung regression.
          V11 controlled: only exactly contiguous consecutive fills may merge (128 KiB maximum); no cross-list or GPU queue merging. Indexed fresh descriptor lookup preserves first declaration. Integer render-target blending backport from upstream eb5061cca62e1addb382cc9c957b81a107d889a6, with distinct pipeline cache key when changed. CPU parallel copy thread count 1-8, default 6. Full Join Parts, Relay, raw CBV, SGPR fix not included; unsafe to transplant without their prerequisites. V9 preserved in its original branch. GPU untested. Use only in an isolated environment with authorized test content. Runtime is not a security sandbox.
          V12: based on V11, inspired by public AvatarManz commits 37332f4d6c37853b48d4d1a5340e119b8c0ad668, 0d5e4c8cbf18b5d30811d02446261a416cfad89c and 86dc10972a409818df5068fdb4716e13ef5ab164. Not cherry-picks or full ports. Joins only adjacent queued submissions with no deferred steps, at most eight lists; no crossing signals or waits. Overlap only private non-sparse ordinary shadow merge with disjoint card ranges, under original completion lock; original GPU wait retained. Aligned CBVs may use existing direct windows below 4 GiB; all other CBVs retain scratch copies. No change to shader translator. Each is opt-in in runtime and enabled by launcher unless individually disabled. No GPU validation. The three experiments may not trigger in a particular scene. Original V9 and V11 branches untouched.
          Use Iniciar-V12.ps1; -V11Behavior disables V12 features, -V9Behavior disables both V11 and V12 features. Use isolated authorized content only.
          See README.md and source-info.json.
          '@ | Set-Content dist/EXPERIMENTAL.txt -Encoding utf8
          @'
          $env:VICTORY_GPU_UPLOAD = '1'
          $env:VICTORY_CARD_BUDGET_PERCENT = '75'
          $env:VICTORY_SNAPSHOT_POOL_MB = '512'
          $env:VICTORY_TILE_SNAPSHOT_MB = '512'
          $env:VICTORY_ASYNC_SUBMIT = '0'
          $env:VICTORY_GPU_WAIT_DETAILS = '0'
          $env:VICTORY_PERF_PARALLEL_REFRESH = '1'
          $env:VICTORY_PERF_LOCAL_QUEUE = '1'
          $env:VICTORY_PERF_SPARSE_CACHE = '1'
          $env:VICTORY_PERF_SPARSE_PARALLEL = '1'
          $env:VICTORY_PERF_PARALLEL_READBACK = '1'
          $env:VICTORY_PERF_BOUNDED_REPROBE = '1'
          $env:VICTORY_PERF_INDEXED_PENDING = '1'
          $env:VICTORY_PERF_AVX2_MERGE = '1'
          $env:VICTORY_SWEEP_TILES = '0'
          $env:VICTORY_RAYS = '0'
          $env:RUST_LOG = 'info,victory_gpu::pipeline=warn,victory_gpu::pipeline::library=info'
          '@ | Set-Content dist/gpu-balance.ps1 -Encoding utf8
          @'
          param(
              [Parameter(Mandatory=$true)][string]$GameExe,
              [ValidateSet('QUALITY','PERFORMANCE')][string]$Profile = 'PERFORMANCE',
              [string]$FfxDir,
              [switch]$V9Behavior,
              [switch]$V11Behavior,
              [switch]$NoJoinParts,
              [switch]$NoRelay,
              [switch]$NoPortConstants,
              [switch]$NoFillJoin,
              [switch]$NoIndexedTables,
              [switch]$NoIntegerBlend,
              [ValidateRange(1,8)][int]$CopyThreads = 6
          )
          $ErrorActionPreference = 'Stop'
          . "$PSScriptRoot\gpu-balance.ps1"
          $env:VICTORY_V11_FILL_JOIN = if ($V9Behavior -or $NoFillJoin) { '0' } else { '1' }
          $env:VICTORY_V11_INDEXED_TABLES = if ($V9Behavior -or $NoIndexedTables) { '0' } else { '1' }
          $env:VICTORY_V11_INTEGER_BLEND = if ($V9Behavior -or $NoIntegerBlend) { '0' } else { '1' }
          $env:VICTORY_V11_COPY_THREADS = if ($V9Behavior) { '6' } else { [string]$CopyThreads }
          $env:VICTORY_V12_JOIN_PARTS = if ($V9Behavior -or $V11Behavior -or $NoJoinParts) { '0' } else { '1' }
          $env:VICTORY_V12_RELAY = if ($V9Behavior -or $V11Behavior -or $NoRelay) { '0' } else { '1' }
          $env:VICTORY_V12_PORT_CONSTANTS = if ($V9Behavior -or $V11Behavior -or $NoPortConstants) { '0' } else { '1' }
          $env:VICTORY_HAIR = '1'
          $env:VICTORY_TEXTURE_HISTORY = '0'
          Remove-Item Env:VICTORY_PRESENT_TARGET,Env:VICTORY_FFX_DIR -ErrorAction SilentlyContinue
          if ($Profile -eq 'PERFORMANCE') {
              if (-not $FfxDir) { throw 'Provide -FfxDir pointing to the official FidelityFX SDK 2.x signedbin directory.' }
              $resolved = (Resolve-Path -LiteralPath $FfxDir).Path
              foreach ($dll in @('amd_fidelityfx_loader_dx12.dll','amd_fidelityfx_upscaler_dx12.dll')) {
                  if (-not (Test-Path -LiteralPath (Join-Path $resolved $dll) -PathType Leaf)) { throw "Missing official SDK DLL: $dll" }
              }
              $env:VICTORY_FFX_DIR = $resolved
              $console = 'series-s'
          } else {
              $console = 'series-x'
          }
          $ErrorActionPreference = 'Continue'
          $tag = if ($V9Behavior) { 'V9BEHAVIOR' } elseif ($V11Behavior) { 'V11BEHAVIOR' } else { 'V12' }
          & "$PSScriptRoot\victory.exe" run $GameExe --execute --console $console 2>&1 | Tee-Object -FilePath "$PSScriptRoot\victory-$tag-$Profile.log"
          '@ | Set-Content dist/Iniciar-V12.ps1 -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: amd-performance-core-v12-OVERLAP
          path: dist/
          if-no-files-found: error
