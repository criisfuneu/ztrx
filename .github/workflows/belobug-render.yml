name: Belobug Radeon build
on:
  push:
    branches: [amd-render-baseline]
    paths:
      - '.github/workflows/belobug-render.yml'
      - 'belobug-patches/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get pinned AMD renderer
        uses: actions/checkout@v4
        with:
          repository: Belobug/VIctory-Belobug-AMD
          ref: 71652a2c15a0da68cd801890e1f71109670f9ca5
          path: runtime
          persist-credentials: false
      - name: Apply reviewed rendering fixes
        shell: pwsh
        working-directory: runtime
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($patch in Get-ChildItem ../belobug-patches/*.patch | Sort-Object Name) {
            git apply --check $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch check failed: $patch" }
            git apply $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch failed: $patch" }
          }
          git diff --stat
      - name: Test AMD renderer and fixes
        shell: pwsh
        working-directory: runtime
        run: |
          $env:RUST_BACKTRACE = '1'
          cargo test --locked --workspace --features diagnostics --profile diag --no-fail-fast -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build optimized diagnostics renderer
        shell: pwsh
        working-directory: runtime
        run: |
          cargo build --locked --profile diag -p victory --features diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./target/diag/victory.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package renderer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item runtime/target/diag/victory.exe dist/
          Copy-Item runtime/README.md,runtime/LICENSE dist/
          Copy-Item launcher/Launcher.cs dist/
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $launcherSource = (Resolve-Path -LiteralPath '.\launcher\Launcher.cs').Path
          $launcherOutput = Join-Path (Get-Location) 'dist\Iniciar-AMD.exe'
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /r:System.Windows.Forms.dll /r:System.Drawing.dll "/out:$launcherOutput" $launcherSource
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
          Copy-Item belobug-patches dist/patches -Recurse
          $manifest = [ordered]@{
            upstream_repository = 'Belobug/VIctory-Belobug-AMD'
            upstream_commit = '71652a2c15a0da68cd801890e1f71109670f9ca5'
            patches = @()
            local_fixes = @('separate-title-runtime-and-asset-roots', 'valid-mutable-test-storage', 'whole-reservation-unmap-and-alias-fallback', 'split-large-shader-source')
            patch_files = @(Get-ChildItem belobug-patches/*.patch | Sort-Object Name | Select-Object -ExpandProperty Name)
            control_commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            binary_sha256 = (Get-FileHash dist/victory.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            build = 'cargo build --locked --profile diag -p victory --features diagnostics'
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content dist/source-info.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: victory-belobug-cris-71652a2
          path: dist/
          if-no-files-found: error
